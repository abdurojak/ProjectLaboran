<style>
    .labhub-realtime-toast {
        border-color: rgba(45, 212, 191, 0.22);
        background: rgba(255, 255, 255, 0.94);
        color: #0f172a;
    }

    .labhub-realtime-toast-icon {
        background: rgba(240, 253, 250, 0.96);
        color: #0f766e;
    }

    .labhub-realtime-toast-title {
        color: #0f172a;
    }

    .labhub-realtime-toast-message {
        color: #475569;
    }

    html[data-theme="dark"] .labhub-realtime-toast {
        border-color: rgba(94, 234, 212, 0.18);
        background: rgba(15, 23, 42, 0.88);
        color: #e2e8f0;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    html[data-theme="dark"] .labhub-realtime-toast-icon {
        background: rgba(20, 184, 166, 0.14);
        color: #67e8f9;
    }

    html[data-theme="dark"] .labhub-realtime-toast-title {
        color: #f8fafc;
    }

    html[data-theme="dark"] .labhub-realtime-toast-message {
        color: #cbd5e1;
    }
</style>
<div id="labhub-realtime-toasts" class="pointer-events-none fixed right-4 top-24 z-[90] grid w-[min(24rem,calc(100vw-2rem))] gap-3" aria-live="polite"></div>
<script>
    (function () {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socketUrl = protocol + '//' + window.location.host + '/ws/notifikasi/';
        const summaryUrl = "{% url 'kalender:notifikasi_summary' %}";
        const toastRoot = document.getElementById('labhub-realtime-toasts');
        let socket = null;
        let reconnectTimer = null;
        let reconnectAttempt = 0;
        let refreshTimer = null;
        let summaryTimer = null;
        let latestSummaryId = null;
        let closedByPage = false;
        let audioContext = null;
        let soundUnlocked = false;

        function getAudioContext() {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return null;
            if (!audioContext) audioContext = new AudioContextClass();
            return audioContext;
        }

        function unlockNotificationSound() {
            const context = getAudioContext();
            if (!context) return;
            if (context.state === 'suspended') {
                context.resume().catch(function () {});
            }
            soundUnlocked = true;
            document.removeEventListener('pointerdown', unlockNotificationSound);
            document.removeEventListener('keydown', unlockNotificationSound);
        }

        function playNotificationSound() {
            if (!soundUnlocked || document.hidden) return;
            const context = getAudioContext();
            if (!context || context.state === 'suspended') return;

            const now = context.currentTime;
            const gain = context.createGain();
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.075, now + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
            gain.connect(context.destination);

            [740, 980].forEach(function (frequency, index) {
                const oscillator = context.createOscillator();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, now + (index * 0.11));
                oscillator.connect(gain);
                oscillator.start(now + (index * 0.11));
                oscillator.stop(now + 0.24 + (index * 0.11));
            });
        }

        function updateBadge(count) {
            document.querySelectorAll('[data-realtime-notification-count]').forEach(function (badge) {
                const value = Number(count || 0);
                badge.textContent = value;
                badge.classList.toggle('hidden', value < 1);
            });
        }

        function showToast(payload) {
            if (!toastRoot) return;
            if (document.querySelector('[data-labbot-pet]')) return;
            const toast = document.createElement('a');
            toast.href = payload.related_url || '#';
            toast.className = 'labhub-realtime-toast pointer-events-auto block rounded-2xl border p-4 shadow-xl shadow-slate-900/15 backdrop-blur transition hover:-translate-y-0.5';
            toast.innerHTML = '<div class="flex items-start gap-3"><span class="labhub-realtime-toast-icon mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-xl"><i data-lucide="bell-ring" class="h-4 w-4"></i></span><div class="min-w-0"><div class="labhub-realtime-toast-title font-black"></div><p class="labhub-realtime-toast-message mt-1 text-sm leading-5"></p></div></div>';
            toast.querySelector('.labhub-realtime-toast-title').textContent = payload.title || 'Pembaruan LabHub';
            toast.querySelector('p').textContent = payload.message || '';
            toastRoot.prepend(toast);
            if (window.lucide) window.lucide.createIcons();
            window.setTimeout(function () { toast.remove(); }, 7000);
        }

        function syncNotificationSummary() {
            if (!summaryUrl || !window.fetch) return;
            fetch(summaryUrl, {
                headers: {'X-Requested-With': 'XMLHttpRequest'},
                credentials: 'same-origin',
            })
                .then(function (response) {
                    if (!response.ok) throw new Error('Ringkasan notifikasi belum tersedia.');
                    return response.json();
                })
                .then(function (payload) {
                    updateBadge(payload.unread_count);
                    if (payload.latest_id && latestSummaryId && payload.latest_id !== latestSummaryId) {
                        document.dispatchEvent(new CustomEvent('labhub:realtime', {
                            detail: {
                                title: payload.latest_title || 'Notifikasi baru',
                                unread_count: payload.unread_count,
                            },
                        }));
                    }
                    if (payload.latest_id) {
                        latestSummaryId = payload.latest_id;
                    }
                })
                .catch(function () {});
        }

        function scheduleRefresh(payload) {
            if (!payload.auto_refresh) return;
            const paths = Array.isArray(payload.refresh_paths) ? payload.refresh_paths : [];
            const shouldRefresh = paths.some(function (path) {
                return path === '/' ? window.location.pathname === '/' : window.location.pathname.startsWith(path);
            });
            if (!shouldRefresh || document.visibilityState !== 'visible') return;
            window.clearTimeout(refreshTimer);
            refreshTimer = window.setTimeout(function () { window.location.reload(); }, 900);
        }

        function connect() {
            if (closedByPage || socket && socket.readyState < 2) return;
            socket = new WebSocket(socketUrl);
            socket.addEventListener('open', function () {
                reconnectAttempt = 0;
                syncNotificationSummary();
            });
            socket.addEventListener('message', function (event) {
                let message;
                try { message = JSON.parse(event.data); } catch (error) { return; }
                if (message.type !== 'notification' || !message.payload) return;
                if (message.payload.unread_count !== undefined) updateBadge(message.payload.unread_count);
                if (!message.payload.silent) {
                    playNotificationSound();
                    showToast(message.payload);
                }
                document.dispatchEvent(new CustomEvent('labhub:realtime', {detail: message.payload}));
                scheduleRefresh(message.payload);
            });
            socket.addEventListener('close', function (event) {
                if (closedByPage || event.code === 4401 || event.code === 4403) return;
                const delay = Math.min(30000, 1000 * Math.pow(2, reconnectAttempt++));
                window.clearTimeout(reconnectTimer);
                reconnectTimer = window.setTimeout(connect, delay);
            });
            socket.addEventListener('error', function () { socket.close(); });
        }

        window.addEventListener('beforeunload', function () {
            closedByPage = true;
            window.clearTimeout(reconnectTimer);
            window.clearInterval(summaryTimer);
            if (socket) socket.close();
        });
        document.addEventListener('pointerdown', unlockNotificationSound, {once: true});
        document.addEventListener('keydown', unlockNotificationSound, {once: true});
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
                syncNotificationSummary();
            }
        });
        window.addEventListener('focus', syncNotificationSummary);
        syncNotificationSummary();
        summaryTimer = window.setInterval(function () {
            if (document.visibilityState === 'visible') {
                syncNotificationSummary();
            }
        }, 5000);
        connect();
    }());
</script>
