{% extends "base.html" %}

{% block title %}Hapus Foto Lab{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl">
    <div class="surface-card overflow-hidden">
        {% if object.gambar %}
        <img src="{{ object.gambar.url }}" alt="{{ object.judul|default:object.ruangan.nama }}" class="h-64 w-full object-cover">
        {% endif %}
        <div class="p-6 md:p-8">
            <p class="text-sm font-black uppercase tracking-[0.2em] text-rose-600">Konfirmasi</p>
            <h2 class="mt-2 text-2xl font-black text-slate-900">Hapus foto lab ini?</h2>
            <p class="mt-3 text-sm leading-7 text-slate-500">Foto untuk <span class="font-black text-slate-800">{{ object.ruangan.nama }}</span> akan dihapus dari galeri ruangan.</p>
            <form method="post" class="mt-6 flex flex-wrap justify-end gap-3">
                {% csrf_token %}
                <a class="btn-secondary" href="{% url 'ruangan:ruangan_list' %}">Batal</a>
                <button class="inline-flex items-center justify-center gap-2 rounded-2xl bg-rose-600 px-4 py-3 text-sm font-black text-white transition hover:bg-rose-700" type="submit">
                    <i data-lucide="trash-2" class="h-4 w-4"></i>
                    Hapus Foto
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
