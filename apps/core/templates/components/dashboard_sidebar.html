<div class="h-fit w-0 shrink-0 transition-all duration-300 md:w-[76px] xl:w-[76px]" data-dashboard-sidebar-shell>
<aside id="dashboard-sidebar" class="fixed inset-y-0 left-0 z-[90] flex h-screen w-[300px] -translate-x-full flex-col overflow-x-hidden border-r border-slate-200 bg-white shadow-soft transition-all duration-300 md:w-[76px] md:translate-x-0 xl:w-[76px]" data-dashboard-sidebar>
    <div class="relative flex min-h-[90px] items-start justify-center border-b border-slate-200 bg-white px-4 pt-4" data-sidebar-brand-shell>
        <button id="dashboard-sidebar-toggle" type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-slate-200 bg-white p-0 text-brand-800 shadow-sm transition hover:border-brand-200 hover:bg-brand-50" aria-label="Tutup menu dashboard" title="Tutup menu" aria-expanded="true">
            <i data-lucide="panel-left-close" class="h-4 w-4"></i>
        </button>
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto overflow-x-hidden overscroll-contain px-3 py-5" data-sidebar-scroll>
        <nav class="grid gap-2">
            {% for link in sidebar_links %}
                {% if link.children %}
                <details data-sidebar-group class="group rounded-2xl" {% if link.expanded %}open{% endif %}>
                    <summary data-sidebar-summary data-active="{% if link.active %}true{% else %}false{% endif %}" class="{% if link.active %}bg-brand-50 text-brand-800 ring-1 ring-brand-100{% else %}text-slate-700 hover:bg-slate-50{% endif %} flex h-14 cursor-pointer list-none items-center gap-4 rounded-2xl px-3 font-semibold transition [&::-webkit-details-marker]:hidden" title="{{ link.title }}">
                        <span data-sidebar-icon class="{{ link.icon_bg }} {{ link.icon_text }} relative flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl">
                            <i data-lucide="{{ link.icon }}" class="h-5 w-5"></i>
                            <span data-sidebar-chevron class="absolute -right-0.5 top-1/2 flex h-3.5 w-3.5 -translate-y-1/2 items-center justify-center rounded-full bg-white/12 text-[9px] text-white/75">
                                <i data-lucide="chevron-right" class="h-2.5 w-2.5 transition group-open:rotate-90"></i>
                            </span>
                        </span>
                        <span data-sidebar-label class="hidden min-w-0 flex-1 truncate">{{ link.title }}</span>
                        <i data-sidebar-label data-lucide="chevron-down" class="hidden h-4 w-4 shrink-0 transition group-open:rotate-180"></i>
                    </summary>
                    <div data-sidebar-submenu class="ml-5 mt-2 grid gap-1 border-l-2 border-slate-100 pl-3">
                        {% for child in link.children %}
                        <a data-sidebar-child data-active="{% if child.active %}true{% else %}false{% endif %}" href="{% url child.url %}" class="{% if child.active %}bg-brand-50 font-bold text-brand-800{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %} flex min-h-11 items-center gap-3 rounded-xl px-3 py-2 text-sm transition" title="{{ child.title }}">
                            <i data-lucide="{{ child.icon }}" class="h-4 w-4 shrink-0"></i>
                            <span data-sidebar-label class="hidden min-w-0 leading-5">{{ child.title }}</span>
                        </a>
                        {% endfor %}
                    </div>
                </details>
                {% elif link.url %}
                <a data-sidebar-link data-active="{% if link.active %}true{% else %}false{% endif %}" href="{% url link.url %}" class="{% if link.active %}bg-brand-50 text-brand-800 ring-1 ring-brand-100{% else %}text-slate-700 hover:bg-slate-50{% endif %} flex h-14 items-center gap-4 rounded-2xl px-3 font-semibold transition" title="{{ link.title }}">
                    <span data-sidebar-icon class="{{ link.icon_bg }} {{ link.icon_text }} flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl">
                        <i data-lucide="{{ link.icon }}" class="h-5 w-5"></i>
                    </span>
                    <span data-sidebar-label class="hidden min-w-0 truncate">{{ link.title }}</span>
                </a>
                {% else %}
                <div class="flex h-14 items-center gap-4 rounded-2xl px-3 text-slate-500" title="{{ link.title }}">
                    <span data-sidebar-icon class="{{ link.icon_bg }} {{ link.icon_text }} flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl">
                        <i data-lucide="{{ link.icon }}" class="h-5 w-5"></i>
                    </span>
                    <span data-sidebar-label class="hidden min-w-0 truncate">{{ link.title }}</span>
                </div>
                {% endif %}
            {% endfor %}
        </nav>

        <div data-sidebar-profile class="mt-6 hidden rounded-[24px] border border-slate-200 bg-gradient-to-b from-white to-brand-50/40 p-5">
            <div class="text-sm font-medium text-slate-500">{{ today|date:"l, d F Y" }}</div>
            <p class="mt-8 text-sm text-slate-500">Selamat datang,</p>
            <p class="text-xl font-bold text-brand-800">Lab Admin</p>
            <div class="mt-6 flex h-20 w-20 items-center justify-center rounded-[28px] bg-brand-100 text-brand-800">
                <i data-lucide="flask-conical" class="h-10 w-10"></i>
            </div>
        </div>
    </div>
    <form method="post" action="{% url 'pengguna:logout' %}" class="px-3 pb-5" data-sidebar-rail-logout>
        {% csrf_token %}
        <button type="submit" class="flex h-11 w-11 items-center justify-center rounded-full text-white/80 transition hover:bg-white/15 hover:text-white" aria-label="Logout" title="Logout">
            <i data-lucide="log-out" class="h-4 w-4"></i>
        </button>
    </form>
</aside>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const sidebar = document.querySelector('[data-dashboard-sidebar]');
        const desktopToggle = document.getElementById('dashboard-sidebar-toggle');
        const mobileToggle = document.getElementById('dashboard-sidebar-mobile-toggle');

        if (!sidebar || !desktopToggle) {
            return;
        }

        const labels = sidebar.querySelectorAll('[data-sidebar-label]');
        const submenus = sidebar.querySelectorAll('[data-sidebar-submenu]');
        const profile = sidebar.querySelector('[data-sidebar-profile]');
        const shell = sidebar.closest('[data-dashboard-sidebar-shell]');
        const mediumQuery = window.matchMedia('(min-width: 768px)');
        const desktopQuery = window.matchMedia('(min-width: 1280px)');
        const coarsePointerQuery = window.matchMedia('(hover: none), (pointer: coarse)');
        const brandShell = sidebar.querySelector('[data-sidebar-brand-shell]');
        const railLogout = sidebar.querySelector('[data-sidebar-rail-logout]');
        const toggles = [desktopToggle, mobileToggle].filter(Boolean);
        const groupSummaries = sidebar.querySelectorAll('[data-sidebar-group] > summary');
        const sidebarLinks = sidebar.querySelectorAll('[data-sidebar-link], [data-sidebar-child]');
        let compactSubmenu = null;
        let isCollapsed = true;

        function navigateWithTransition(href) {
            const appContent = document.querySelector('[data-app-content]');
            if (
                appContent
                && !coarsePointerQuery.matches
                && !window.matchMedia('(prefers-reduced-motion: reduce)').matches
            ) {
                appContent.classList.add('is-leaving');
                window.setTimeout(function () {
                    window.location.href = href;
                }, 120);
                return;
            }
            window.location.href = href;
        }

        function markActiveLink(href) {
            let targetHref;
            try {
                targetHref = new URL(href, window.location.href).href;
            } catch (error) {
                targetHref = href;
            }

            sidebar.querySelectorAll('[data-sidebar-summary]').forEach(function (summary) {
                summary.dataset.active = 'false';
            });

            sidebarLinks.forEach(function (link) {
                const isActive = link.href === targetHref;
                link.dataset.active = isActive ? 'true' : 'false';
                if (isActive) {
                    const group = link.closest('[data-sidebar-group]');
                    const summary = group ? group.querySelector('[data-sidebar-summary]') : null;
                    if (summary) {
                        summary.dataset.active = 'true';
                    }
                }
            });
        }

        function closeCompactSubmenu() {
            if (!compactSubmenu) {
                return;
            }
            compactSubmenu.classList.add('pointer-events-none', 'opacity-0', 'scale-95', '-translate-x-1');
            compactSubmenu.classList.remove('pointer-events-auto', 'opacity-100', 'scale-100', 'translate-x-0');
            compactSubmenu.setAttribute('aria-hidden', 'true');
        }

        function getCompactSubmenu() {
            if (compactSubmenu) {
                return compactSubmenu;
            }

            compactSubmenu = document.createElement('div');
            compactSubmenu.setAttribute('data-sidebar-compact-submenu', '');
            compactSubmenu.setAttribute('aria-hidden', 'true');
            compactSubmenu.className = 'pointer-events-none fixed z-[80] w-[min(17rem,calc(100vw-7rem))] origin-left -translate-x-1 scale-95 overflow-hidden rounded-[1.4rem] border p-2 opacity-0 shadow-2xl' + (coarsePointerQuery.matches ? '' : ' transition duration-150');
            document.body.appendChild(compactSubmenu);

            compactSubmenu.addEventListener('click', function (event) {
                const link = event.target.closest('a[href]');
                if (!link) {
                    return;
                }
                event.preventDefault();
                markActiveLink(link.href);
                closeCompactSubmenu();
                navigateWithTransition(link.href);
            });

            return compactSubmenu;
        }

        function openCompactSubmenu(summary) {
            const group = summary.closest('[data-sidebar-group]');
            const submenu = group ? group.querySelector('[data-sidebar-submenu]') : null;
            const children = submenu ? Array.from(submenu.querySelectorAll('[data-sidebar-child]')) : [];
            if (!children.length) {
                return;
            }

            const menu = getCompactSubmenu();
            const title = summary.getAttribute('title') || 'Submenu';
            menu.innerHTML = '<div class="px-3 pb-2 pt-1 text-[0.67rem] font-black uppercase tracking-[0.22em]" data-compact-submenu-title></div>' +
                children.map(function (child) {
                    const icon = child.querySelector('i') ? child.querySelector('i').getAttribute('data-lucide') : 'circle';
                    const active = child.dataset.active === 'true';
                    return '<a href="' + child.href + '" data-active="' + (active ? 'true' : 'false') + '" class="flex min-h-11 min-w-0 items-center gap-3 rounded-2xl px-3 py-2 text-sm font-bold transition">' +
                        '<span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl"><i data-lucide="' + icon + '" class="h-4 w-4"></i></span>' +
                        '<span class="min-w-0 flex-1 truncate">' + child.textContent.trim() + '</span>' +
                    '</a>';
                }).join('');
            menu.querySelector('[data-compact-submenu-title]').textContent = title;

            menu.style.visibility = 'hidden';
            menu.setAttribute('aria-hidden', 'false');
            menu.classList.remove('pointer-events-none');

            const sidebarRect = sidebar.getBoundingClientRect();
            const summaryRect = summary.getBoundingClientRect();
            const menuRect = menu.getBoundingClientRect();
            const left = Math.min(sidebarRect.right + 10, window.innerWidth - menuRect.width - 12);
            const top = Math.min(
                Math.max(summaryRect.top - 8, 12),
                Math.max(window.innerHeight - menuRect.height - 12, 12)
            );
            menu.style.left = left + 'px';
            menu.style.top = top + 'px';
            menu.style.visibility = 'visible';
            menu.classList.add('pointer-events-auto', 'opacity-100', 'scale-100', 'translate-x-0');
            menu.classList.remove('pointer-events-none', 'opacity-0', 'scale-95', '-translate-x-1');

            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        function setToggleIcon(iconName) {
            toggles.forEach(function (toggle) {
                toggle.innerHTML = '<i data-lucide="' + iconName + '" class="h-4 w-4"></i>';
            });
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        function setCollapsed(collapsed) {
            const isMedium = mediumQuery.matches;
            isCollapsed = collapsed;
            closeCompactSubmenu();
            sidebar.dataset.collapsed = collapsed ? 'true' : 'false';
            sidebar.classList.toggle('is-collapsed', collapsed);
            document.body.classList.toggle('dashboard-sidebar-expanded', isMedium && !collapsed);

            sidebar.classList.toggle('-translate-x-full', collapsed && !isMedium);
            sidebar.classList.toggle('translate-x-0', !collapsed || isMedium);
            sidebar.classList.toggle('w-[300px]', !collapsed && !isMedium);
            sidebar.classList.toggle('md:w-[300px]', isMedium && !collapsed && !desktopQuery.matches);
            sidebar.classList.toggle('w-[76px]', collapsed);
            sidebar.classList.toggle('md:w-[76px]', collapsed || (isMedium && desktopQuery.matches));
            sidebar.classList.toggle('xl:w-[280px]', !collapsed && desktopQuery.matches);
            sidebar.classList.toggle('xl:w-[76px]', collapsed && desktopQuery.matches);
            if (shell) {
                shell.classList.toggle('w-0', !isMedium);
                shell.classList.toggle('w-[300px]', isMedium && !collapsed && !desktopQuery.matches);
                shell.classList.toggle('md:w-[300px]', isMedium && !collapsed && !desktopQuery.matches);
                shell.classList.toggle('w-[76px]', isMedium && collapsed);
                shell.classList.toggle('md:w-[76px]', isMedium && (collapsed || desktopQuery.matches));
                shell.classList.toggle('xl:w-[280px]', isMedium && !collapsed && desktopQuery.matches);
                shell.classList.toggle('xl:w-[76px]', isMedium && collapsed && desktopQuery.matches);
            }

            toggles.forEach(function (toggle) {
                toggle.setAttribute('aria-expanded', String(!collapsed));
                toggle.setAttribute('aria-label', collapsed ? 'Buka menu dashboard' : 'Tutup menu dashboard');
                toggle.setAttribute('title', collapsed ? 'Buka menu' : 'Tutup menu');
            });

            labels.forEach(function (label) {
                label.classList.toggle('hidden', collapsed);
                label.classList.toggle('block', !collapsed);
            });

            submenus.forEach(function (submenu) {
                submenu.classList.toggle('hidden', collapsed);
                submenu.classList.toggle('grid', !collapsed);
            });

            if (collapsed) {
                sidebar.querySelectorAll('[data-sidebar-group]').forEach(function (group) {
                    group.open = false;
                });
            }

            if (brandShell) {
                brandShell.classList.toggle('justify-center', collapsed);
                brandShell.classList.toggle('justify-end', !collapsed);
                brandShell.classList.toggle('px-3', collapsed);
                brandShell.classList.toggle('px-4', !collapsed);
            }

            if (profile) {
                profile.classList.toggle('hidden', collapsed);
                profile.classList.toggle('block', !collapsed);
            }

            if (railLogout) {
                railLogout.classList.toggle('hidden', !collapsed);
                railLogout.classList.toggle('block', collapsed);
            }

            setToggleIcon(collapsed ? 'menu' : 'x');
        }

        setCollapsed(true);

        groupSummaries.forEach(function (summary) {
            summary.addEventListener('click', function (event) {
                if (!isCollapsed) {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                summary.parentElement.open = false;
                openCompactSubmenu(summary);
            });
        });

        sidebarLinks.forEach(function (link) {
            link.addEventListener('click', function () {
                markActiveLink(link.href);
                closeCompactSubmenu();
            });
        });

        document.addEventListener('click', function (event) {
            if (!compactSubmenu) {
                return;
            }
            if (sidebar.contains(event.target) || compactSubmenu.contains(event.target)) {
                return;
            }
            closeCompactSubmenu();
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeCompactSubmenu();
            }
        });

        window.addEventListener('resize', closeCompactSubmenu);
        window.addEventListener('scroll', closeCompactSubmenu, true);

        function handleToggleClick(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            const nextCollapsed = sidebar.dataset.collapsed !== 'true';
            setCollapsed(nextCollapsed);
        }

        desktopToggle.addEventListener('click', handleToggleClick);
        if (mobileToggle) {
            mobileToggle.addEventListener('click', handleToggleClick);
        }

        desktopQuery.addEventListener('change', function () {
            setCollapsed(true);
        });
        mediumQuery.addEventListener('change', function () {
            setCollapsed(true);
        });
    });
</script>
