{% load static %}
<style>
    [data-app-footer] {
        --footer-panel: color-mix(in srgb, var(--dashboard-surface-bg) 92%, transparent);
        --footer-border: var(--dashboard-surface-border);
        --footer-text: var(--text-main);
        --footer-muted: var(--text-muted);
        --footer-accent: #14b8a6;
        color: var(--footer-text);
    }

    [data-app-footer] .app-footer-panel {
        display: grid;
        grid-template-columns: minmax(15rem, 1.05fr) minmax(20rem, 1.4fr) auto;
        align-items: center;
        gap: clamp(1.25rem, 2.5vw, 3rem);
        border: 1px solid var(--footer-border);
        border-block: 3px solid var(--footer-text);
        border-radius: 1.4rem;
        background: var(--footer-panel);
        padding: clamp(1rem, 1.6vw, 1.5rem);
        box-shadow: var(--dashboard-surface-shadow);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
    }

    [data-app-footer] .app-footer-brand {
        display: grid;
        grid-template-columns: 4.6rem minmax(0, 1fr);
        align-items: center;
        gap: 1rem;
        min-width: 0;
    }

    [data-app-footer] .app-footer-logo {
        display: grid;
        width: 4.6rem;
        height: 4.6rem;
        place-items: center;
        overflow: hidden;
        border: 2px solid color-mix(in srgb, var(--footer-text) 78%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--dashboard-surface-bg) 82%, transparent);
    }

    [data-app-footer] .app-footer-logo img {
        width: 3.65rem;
        height: 3.65rem;
        object-fit: contain;
    }

    [data-app-footer] .app-footer-kicker {
        color: var(--footer-accent);
        font-size: 0.68rem;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
    }

    [data-app-footer] .app-footer-title {
        margin-top: 0.2rem;
        color: var(--footer-text);
        font-size: clamp(1.05rem, 1.35vw, 1.35rem);
        font-weight: 950;
        line-height: 1.1;
    }

    [data-app-footer] .app-footer-muted {
        color: var(--footer-muted);
    }

    [data-app-footer] .app-footer-contact {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.55rem 1.25rem;
        min-width: 0;
        font-size: 0.78rem;
        line-height: 1.35;
    }

    [data-app-footer] .app-footer-contact > * {
        display: flex;
        min-width: 0;
        align-items: flex-start;
        gap: 0.55rem;
    }

    [data-app-footer] .app-footer-contact svg {
        width: 0.95rem;
        height: 0.95rem;
        flex: 0 0 auto;
        margin-top: 0.05rem;
        color: var(--footer-accent);
    }

    [data-app-footer] .app-footer-contact span {
        min-width: 0;
        overflow-wrap: anywhere;
    }

    [data-app-footer] .app-footer-links {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.45rem;
    }

    [data-app-footer] .app-footer-link {
        display: inline-grid;
        width: 2.65rem;
        height: 2.65rem;
        place-items: center;
        border: 1px solid var(--footer-border);
        border-radius: 0.9rem;
        background: color-mix(in srgb, var(--dashboard-surface-bg) 86%, transparent);
        color: var(--footer-text);
        transition: transform 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    [data-app-footer] .app-footer-link:hover {
        border-color: var(--footer-accent);
        color: var(--footer-accent);
        transform: translateY(-2px);
    }

    [data-app-footer] .app-footer-link svg {
        width: 1.05rem;
        height: 1.05rem;
    }

    [data-app-footer] .app-footer-copyright {
        padding: 0.8rem 0.5rem 0;
        color: var(--footer-muted);
        text-align: center;
        font-size: 0.7rem;
    }

    @media (max-width: 1023px) {
        [data-app-footer] .app-footer-panel {
            grid-template-columns: minmax(14rem, 0.9fr) minmax(18rem, 1.2fr);
        }

        [data-app-footer] .app-footer-links {
            grid-column: 1 / -1;
            justify-content: center;
        }
    }

    @media (max-width: 767px) {
        [data-app-footer] {
            margin-top: 0 !important;
        }

        [data-app-footer] .app-footer-panel {
            grid-template-columns: minmax(0, 1fr);
            gap: 1rem;
            border-radius: 1.15rem;
            padding: 1rem;
        }

        [data-app-footer] .app-footer-brand {
            grid-template-columns: 3.8rem minmax(0, 1fr);
        }

        [data-app-footer] .app-footer-logo {
            width: 3.8rem;
            height: 3.8rem;
        }

        [data-app-footer] .app-footer-logo img {
            width: 3rem;
            height: 3rem;
        }

        [data-app-footer] .app-footer-contact {
            grid-template-columns: minmax(0, 1fr);
        }

        [data-app-footer] .app-footer-links {
            grid-column: auto;
            justify-content: flex-start;
        }
    }
</style>
