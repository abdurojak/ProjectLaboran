name: Deploy AlmaLinux

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Deploy aplikasi
        run: |
          set -e
          APP_DIR=/home/admin/LabTif/ProjectLaboran
          cd "$APP_DIR"
          git pull --ff-only origin main
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          sudo -n systemctl daemon-reload
          sudo -n systemctl restart projectlaboran-daphne
          systemctl is-active --quiet projectlaboran-daphne
          echo "Deployment berhasil di $(hostname)"
