name: Publish Production Container

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: projectlaboran-production
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'abdurojak/ProjectLaboran' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_DATABASE: project_laboran_ci
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      SECRET_KEY: ci-only-secret-key-9Kf7vQ2mL5sX8nD1cR4hT6pW3yB0aG7uE9jN2zC5
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      PUBLIC_ACCESS_BASE_URL: http://127.0.0.1:8000
      DB_NAME: project_laboran_ci
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      MEDIA_ROOT: /tmp/labhub-ci-media

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run MySQL regression suite
        run: python manage.py test --verbosity 1

      - name: Validate migrations and Django configuration
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check
          SECURE_SSL_REDIRECT=True \
          SESSION_COOKIE_SECURE=True \
          CSRF_COOKIE_SECURE=True \
          SECURE_HSTS_SECONDS=31536000 \
          SECURE_HSTS_INCLUDE_SUBDOMAINS=True \
          SECURE_HSTS_PRELOAD=True \
            python manage.py check --deploy

  build:
    needs: test
    if: github.repository == 'abdurojak/ProjectLaboran' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Build protected release
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --env HOST_UID="$(id -u)" \
            --env HOST_GID="$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            quay.io/pypa/manylinux_2_28_x86_64@sha256:b04887b645dde99b9e955aeae3ff4da414992d0bd88259f046295b56361c5614 \
            /bin/bash -euo pipefail -c '
              PYTHON=/opt/python/cp311-cp311/bin/python
              dnf install -y mariadb-connector-c-devel pkgconf-pkg-config
              dnf clean all
              "$PYTHON" -m pip install --disable-pip-version-check -r requirements-build.txt
              "$PYTHON" -m piptools compile \
                --generate-hashes \
                --no-emit-index-url \
                --no-emit-trusted-host \
                --output-file requirements.lock \
                requirements.txt
              rm -rf wheelhouse
              mkdir -p wheelhouse
              "$PYTHON" -m pip wheel \
                --disable-pip-version-check \
                --require-hashes \
                --wheel-dir wheelhouse \
                -r requirements.lock
              "$PYTHON" deployment/build_protected_artifact.py \
                --source . \
                --staging build/protected/release \
                --output dist/protected/projectlaboran.protected.tar.gz \
                --allowlist deployment/protected_modules.txt
              chown -R "$HOST_UID:$HOST_GID" build dist requirements.lock wheelhouse
            '

      - name: Sign and package release
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.PRODUCTION_ARTIFACT_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PYTHON=/usr/bin/python3
          OPENSSL=/usr/bin/openssl
          KEY_FILE="$RUNNER_TEMP/projectlaboran-artifact-signing.pem"
          DERIVED_PUBLIC="$RUNNER_TEMP/projectlaboran-artifact-signing.pub.pem"
          cleanup() {
            /usr/bin/shred -u -- "$KEY_FILE" 2>/dev/null || /usr/bin/rm -f -- "$KEY_FILE"
            /usr/bin/rm -f -- "$DERIVED_PUBLIC"
          }
          trap cleanup EXIT
          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "PRODUCTION_ARTIFACT_SIGNING_PRIVATE_KEY is not configured." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE"
          unset SIGNING_KEY
          "$OPENSSL" pkey -in "$KEY_FILE" -pubout -out "$DERIVED_PUBLIC"
          cmp -s "$DERIVED_PUBLIC" deployment/artifact_signing_public.pem || {
            echo "Signing secret does not match the committed production public key." >&2
            exit 1
          }
          "$PYTHON" deployment/package_release.py manifest \
            --archive dist/protected/projectlaboran.protected.tar.gz \
            --output dist/protected/deployment-manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --source-ref "$GITHUB_REF" \
            --source-sha "$GITHUB_SHA" \
            --workflow .github/workflows/test-runner.yml
          "$OPENSSL" pkeyutl -sign \
            -inkey "$KEY_FILE" \
            -rawin \
            -in dist/protected/deployment-manifest.json \
            -out dist/protected/deployment-manifest.sig
          "$PYTHON" deployment/package_release.py envelope \
            --archive dist/protected/projectlaboran.protected.tar.gz \
            --manifest dist/protected/deployment-manifest.json \
            --signature dist/protected/deployment-manifest.sig \
            --output dist/protected/projectlaboran.deploy.tar

      - name: Upload signed deployment envelope
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: projectlaboran-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/protected/projectlaboran.deploy.tar
          if-no-files-found: error
          retention-days: 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish protected container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/abdurojak/projectlaboran:${{ github.sha }}
            ghcr.io/abdurojak/projectlaboran:production
